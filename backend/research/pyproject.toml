[project]
name = "sadar-research"
version = "0.2.0"
description = "Executable historical trajectory-anomaly research for SADAR"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "sadar",
    "scikit-learn>=1.4.0",
    "torch>=2.2",
]

[project.optional-dependencies]
data = [
    "geopandas>=0.14.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.12",
    "pyopensky",
    "python-dotenv>=1.0.0",
    "requests>=2.32",
    "shapely>=2.0.0",
    "supabase>=2.29.0",
    "traffic>=2.9",
    "trino>=0.328",
]
notebooks = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "pyarrow>=15.0.0",
]
reports = [
    "anthropic>=0.105.2",
]

[tool.uv.sources]
sadar = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadar_research"]
