# ML lifecycle manifest — single source of truth for the project's ML phase state.
# Lives at backend/docs/ml/manifest.yml (project convention; CLAUDE.md documents the path).
# Read by /ml-lifecycle and /develop to know which phase we're in and which gates passed.

project_name: "Drone Trajectory Anomaly Detection (LEMD)"
problem_type: "anomaly_detection"
model_track: "dl"   # tentative — LSTM Autoencoder primary, Isolation Forest baseline.
                    # Confirmed in Phase 6 once we see whether the LSTM AE meaningfully
                    # beats IF. If not, we flip to "ml" and ship IF.

current_phase: "preprocess"

# Gate ledger — append, never rewrite.
gates:
  problem:
    status: "passed"
    gate_semantics: "one_shot"
    passed_at: "2026-05-07"
    artifact: "backend/docs/ml/01-problem.md"
    summary: "Anomaly detection on LEMD ADS-B. LSTM AE primary, IF baseline. AUROC>0.85 primary, F2 operational, FPR<=15% guardrail. FN dominates operationally."
  data:
    status: "passed"
    gate_semantics: "cyclic"   # data accumulates per Supabase 500MB-cycle (see workflow doc).
                               # `passed` means audit discipline operational; future cycles append.
    passed_at: "2026-05-11"
    artifact: "backend/docs/ml/02-data.md"
    dataset_hash:
      # Cycle 1: 2025-03-10 to 2025-03-14 (5 days, Mon-Fri). Snapshot 2026-05-10.
      # Canonical artifact is the deduped parquet (raw had 37.5% script-rerun
      # duplicates; full audit lineage in 02-data.md).
      lemd_20250310_to_20250314__deduped_2026-05-10: "8256c65f95135597f3db07413941380fc2a0c6bbfc429b07b12b10478f7e2c10"
      # Cycle 2: 2026-03-10 to 2026-03-14 (5 days, Tue-Sat). Snapshot 2026-05-11.
      # Year-over-year repeat of cycle 1's calendar window. Snapshot is canonical
      # (no dedup needed — Monica's UNIQUE constraint working; full audit lineage
      # in 02-data.md "Cycle 2" section).
      lemd_20260310_to_20260314__snapshot_2026-05-11: "16f1bd2cbdbd519ce7bde6fbbc8df5012b188b54c5598bffc310cef34b0c6899"
      # Cycle 3: OpenSky scientific dataset (entry #1, Weekly 24h State Vectors
      # 2017-2022). 20 Mondays sampled 2017-06 → 2020-03, COVID excluded. Per-Monday
      # parquets in data/raw/opensky_states/. Combined hash is a sorted Merkle
      # of per-file sha256 values (18 of 20 planned Mondays landed; 2018-04-02
      # and 2019-12-02 failed a residual lat/lon coercion bug — documented as
      # a known limitation, ship 18). Pivot rationale: D-007.
      lemd_opensky_states_2017to2020__cycle3_2026-05-23: "98e38ba5802816a97f17b2086df18570c6f81311d80faeed0492ad87abd662e4"
    summary: |
      Audit discipline operational (cyclic gate). Future cycles append to
      dataset_hash and to 02-data.md's snapshot log without re-passing the gate.

      Cycle 1 (2026-05-10): 2025-03-10 to 2025-03-14 (5 days, Mon-Fri). 1,834,084
      raw rows → 1,146,231 deduped (37.5% removed; upstream script-rerun bug,
      fixed for future cycles via unique constraint). 1,285 unique trajectories,
      330 unique aircraft. Real=PASS, Usable=PASS, Enough=SOFT_DEV.

      Cycle 2 (2026-05-11): 2026-03-10 to 2026-03-14 (5 days, Tue-Sat).
      1,774,859 rows, 1,426 trajectories, 350 unique aircraft. ZERO duplicates
      — Monica's UNIQUE constraint fix from issue #13 confirmed effective in
      production. 3 baroaltitude nulls (0.000169%, response D, below D-206's
      0.1% tolerance). Pipeline consistency PASS. Cycle 2 surfaced one new
      methodology gap: table arrived without indexes — added (time, icao24)
      index during audit; response F (Monica's pipeline should provision
      indexes upfront in future). Real=PASS, Usable=PASS (after D-206
      tolerance), Enough=SOFT_DEV.

      Cumulative through cycle 2: 10 days (Mon-Sat coverage 6/7, Sunday still
      missing), 2,711 trajectories. Still below 30-day / 5K-trajectory
      thresholds for Enough=PASS at that point.

      Cycle 3 (closed 2026-05-23): pivot to OpenSky scientific dataset
      (entry #1) per D-007 — Trino + Supabase ingestion was the dominant
      bottleneck. 18 of 20 planned Mondays landed (2 residual failures on
      2018-04-02 and 2019-12-02 from an object-dtype-after-concat bug in
      `apply_derivations`, documented and deferred). 10s resolution (vs
      Trino path's 5s), Filter B applied (min_dist<10km AND min_alt<3km
      per trajectory) to exclude cruise overflights since the scientific
      dataset lacks the `flights_data4` origin/destination metadata the
      Trino path used. Final yield: 19,057 trajectories / 3.43M rows /
      ~123 MB on disk. Dataset is cite-able via OpenSky publication,
      which becomes a writeup asset.

      Cumulative through cycle 3: 28 days (Mon-Sat coverage 6/7, Sunday
      still missing, Monday heavily over-represented), 21,768 trajectories,
      ~6.35M rows. Crosses both the 30-day calendar threshold (with the
      caveat that cycle 3's 18 days span 2017-2020 rather than being
      contiguous) and the 5K-trajectory threshold → Enough=CONDITIONAL.
