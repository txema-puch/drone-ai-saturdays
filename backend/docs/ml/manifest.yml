# THE TEST SET FIREWALL — sacred. Never peeked, never modified except in Phase 7.
#
# Split-discipline note (2026-05-31): a teammate's parallel project SADAR
# (huggingface.co/spaces/devrup404/sadar), on the SAME OpenSky-LEMD data, ships
# exactly the dual-criterion leak-free split we planned: jointly by flight_id
# AND by date — no flight appears in two splits (group leakage), and test is
# strictly later in time than train (temporal leakage). They use 2017-2019 for
# train/val and reserve 2020 for test, which doubles as a free distribution-shift
# stress test (start of COVID). This independently validates the strategy below.
# Caveat for us: our cycle-3 data is 18 *Mondays* spanning 2017-2020 (not
# contiguous, Monday-skewed per D-009), so a pure year-based temporal cut leaves
# a thin/uneven test fold. Decide in Phase 6 whether to mirror their year cut or
# use a group-only (flight_id/icao24) split with a held-out block of Mondays;
# either way, keep BOTH criteria (group + temporal) — that is the part to copy.
test_set:
  defined_at: "2026-06-01"       # Phase 6, issue #27
  split_seed: null               # deterministic by construction (fixed Monday→fold map, no RNG)
  split_strategy: "temporal-by-Monday (train 2017-18 < val 2019 < test 2020) + no-identity-leak
    guard (icao24/flight_id ∉ AE_FEATURES); held-aside emergency∪go_around∪impossible pulled
    pre-split. icao24 cross-fold overlap reported (train∩test 406, all-3 274), NOT asserted-zero —
    leak-free because identifiers are not features; seen/unseen AUROC Δ −0.061 confirms benign
    (D-009 + eng-review-2 amendment)."
  holdout_path: "backend/models/phase6/split_ids.json"   # test = 4,285 clean segments (2020)
  count: 4285
  burned: true
  burned_at: "2026-06-02"
  burn_reason: |
    Phase-7 final evaluation in provenance commit 7b7bbf3. The sealed 2020 fold was scored
    once with AE, kNN, and IF on the D-012 synthetic mix and the real-event cohort versus
    test-normal. Threshold and representative-selection rules were fixed before the burn.
    Results: backend/docs/ml/07-eval.md and phase7_burn_results.json. The cohort was later
    inspected for D-014 deployment findings and cannot be reused as an untouched holdout for
    a redesigned pipeline.

