    baseline_score: null
    best_model_id: null
    fitted_pipeline_artifact: null
    summary: null
  eval:
    status: "pending"
    gate_semantics: "one_shot"
    passed_at: null
    artifact: null
    holdout_score: null
    holdout_ci: null
    summary: |
      Phase 7 entry decision pending. Two artifacts feed this gate:

      1. backend/docs/ml/07-eval-prep.md — synthetic anomaly injection
         calibration (Layer 2 of D-008 validation stack). Research synthesis
         from FAA UAS Sightings + Bard + Spanish news, ~2,200 incidents,
         2026-05-10. Headline changes: asymmetric upward altitude shift
         (not symmetric ±300m), sustained-loiter variant (60-300s alongside
         30s), demoted speed spike (1.5-2x, ≤10% of mix), 40%
         zone-violation share, add final-approach-intercept and multi-drone
         types.

      2. D-008 — multi-layer output validation (added 2026-05-23). The
         reconstruction-error number has no semantic meaning until external
         evidence grounds it. Validation stack: (1) sanity, (2) discriminative
         AUROC on synthetic injections per D-005, (3) realism via geofence +
         safety-net rules baseline, (4) **external** via OpenSky Dataset #6
         (Olive et al., 2020) — real 7700-squawk emergency flights the
         model never trained on or saw injected, (5) qualitative top-K
         review of model-flagged "normal" flights. Layers 4 and 5 protocols
         live in 07-eval-prep.md > "Validating beyond synthetic discrimination."
  deploy:
    status: "pending"
    gate_semantics: "one_shot"   # course-project demo, not a production deploy.
                                 # Would be "ongoing" for a real-time production system.
