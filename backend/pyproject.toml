[project]
name = "drone-rute"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3.0",
    # Data / cálculo
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    # Machine learning
    "scikit-learn>=1.4.0",
    # 🔥 CLAVE: OpenSky + histórico
    "pyopensky",
    "trino>=0.328",
    # 🌍 Geoespacial (muy importante para rutas)
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # ✈️ Análisis de tráfico aéreo (nivel pro)
    "traffic>=2.9",
    "psycopg2-binary>=2.9.12",
    "supabase>=2.29.0",
    # HTTP client used by backend/scripts/download_opensky_states.py
    "requests>=2.32",
    # 📊 EDA / notebooks
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests import `backend.core.*`; the package root is the repo root (one level up
# from this pyproject). tests/conftest.py puts it on sys.path so the namespace
# package resolves without an installed wheel and without touching credentials.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# TEMPORARY (May 2026): macOS Intel (x86_64) compatibility.
# `traffic` (in deps above) pulls in `onnxruntime`, whose latest versions don't
# ship macOS Intel wheels. This block forces uv to resolve to onnxruntime
# versions that DO have macOS Intel wheels. Harmless for Apple Silicon, Linux,
# and Windows installs. Remove once no team member is on macOS Intel anymore.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
