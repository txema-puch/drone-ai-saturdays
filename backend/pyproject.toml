[project]
name = "drone-rute"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.22",
    "asyncpg>=0.29.0",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3.0",
    # Data / cálculo
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    # Machine learning
    "scikit-learn>=1.4.0",
    # Deep learning — Phase 6 LSTM autoencoder (issue #27). CPU-trainable (small AE,
    # ~9 features / ~9k train sequences); no GPU needed for the course demo.
    "torch>=2.2",
    # 🔥 CLAVE: OpenSky + histórico
    "pyopensky",
    "trino>=0.328",
    # 🌍 Geoespacial (muy importante para rutas)
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # ✈️ Análisis de tráfico aéreo (nivel pro)
    "traffic>=2.9",
    "psycopg2-binary>=2.9.12",
    "supabase>=2.29.0",
    # HTTP client used by backend/scripts/download_opensky_states.py
    "requests>=2.32",
    # 📊 EDA / notebooks
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
    "pyarrow>=15.0.0",
    "anthropic>=0.105.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
publish = [
    # Local release publication only. Never copy this group into the serving image.
    "huggingface-hub==0.34.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests import `backend.core.*`; the package root is the repo root (one level up
# from this pyproject). tests/conftest.py puts it on sys.path so the namespace
# package resolves without an installed wheel and without touching credentials.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# NOTE (2026-06-01, issue #27): the macOS-Intel `[tool.uv] required-environments` pin was
# REMOVED here. Its own TEMPORARY comment said "remove once no team member is on macOS
# Intel anymore" — confirmed no longer the case. The pin would have blocked torch (modern
# PyTorch ships no macOS x86_64 wheels). The team's reproducibility env is the Linux
# devcontainer, where torch wheels resolve cleanly. Re-add the pin only if an Intel-Mac
# teammate returns.
