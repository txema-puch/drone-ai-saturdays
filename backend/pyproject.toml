[project]
name = "sadar"
version = "0.2.0"
description = "Rules-first post-flight approach screening for the SADAR Analyst Console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.22",
    "requests>=2.32",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
sadar-api = "sadar.api.cli:main"
sadar-acquire-context = "sadar.pipelines.acquire_context:main"
sadar-audit-context = "sadar.pipelines.audit_context:main"
sadar-audit-dataset = "sadar.pipelines.audit_dataset:main"
sadar-build-release = "sadar.pipelines.build_release:main"
sadar-build-synthetic-demo = "sadar.pipelines.build_synthetic_demo:main"
sadar-build-context-release = "sadar.pipelines.build_context_release:main"
sadar-project-public-aggregates = "sadar.pipelines.build_release:projection_main"
sadar-validate-public-release = "sadar.releases.approach:validation_main"
sadar-burn-holdout = "sadar.pipelines.burn_holdout:main"
sadar-evaluate-context = "sadar.pipelines.evaluate_context:main"
sadar-fetch-release = "sadar.releases.fetch:main"
sadar-fit-reference = "sadar.pipelines.fit_reference:main"
sadar-fit-context-reference = "sadar.pipelines.fit_context_reference:main"
sadar-publish-release = "sadar.pipelines.publish_release:main"
sadar-screening-feasibility = "sadar.pipelines.feasibility:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
]
publish = [
    "huggingface-hub==0.34.3",
]

[tool.uv.workspace]
members = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadar"]

[tool.hatch.build.targets.sdist]
include = ["src/sadar", "pyproject.toml"]
