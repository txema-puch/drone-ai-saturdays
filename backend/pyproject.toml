[project]
name = "sadar"
version = "0.2.0"
description = "Rules-first post-flight approach screening for the SADAR Analyst Console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
sadar-api = "sadar.api.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
]
publish = [
    "huggingface-hub==0.34.3",
]

[tool.uv.workspace]
members = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadar"]

[tool.hatch.build.targets.sdist]
include = ["src/sadar", "pyproject.toml"]
