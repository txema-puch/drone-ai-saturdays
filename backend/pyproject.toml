[project]
name = "drone-rute"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3.0",
    # Data / cálculo
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    # Machine learning
    "scikit-learn>=1.4.0",
    # 🔥 CLAVE: OpenSky + histórico
    "pyopensky",
    "trino>=0.328",
    # 🌍 Geoespacial (muy importante para rutas)
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # ✈️ Análisis de tráfico aéreo (nivel pro)
    "traffic>=2.9",
    "psycopg2-binary>=2.9.12",
    "supabase>=2.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
