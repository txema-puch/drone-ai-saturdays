name: Clean checkout delivery

on:
  pull_request:
  push:
    branches: [main, develop, task-sadar-merge-c]

permissions:
  contents: read

concurrency:
  group: clean-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out tracked inputs only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the lockfile compiler
        run: python3 -m pip install --disable-pip-version-check uv==0.11.13

      - name: Validate delivery contracts
        run: scripts/check-delivery-contract.py

      - name: Prove the Linux serving lock regenerates without drift
        run: |
          cp delivery/container/requirements-linux-x86_64.lock /tmp/requirements-linux-x86_64.lock
          scripts/compile-serving-lock.sh
          cmp /tmp/requirements-linux-x86_64.lock delivery/container/requirements-linux-x86_64.lock

      - name: Prove the container build lock regenerates without drift
        run: |
          cp delivery/container/build-requirements.lock /tmp/build-requirements.lock
          scripts/compile-build-lock.sh
          cmp /tmp/build-requirements.lock delivery/container/build-requirements.lock

      - name: Fetch the immutable historical research releases
        run: |
          uv run --project backend/research sadar-research-fetch-release \
            --lock backend/research/src/sadar_research/trajectory_anomaly/releases/demo_bundle.lock.json \
            --destination /tmp/sadar-ci-demo-release
          uv run --project backend/research sadar-research-fetch-training-artifacts \
            --lock backend/research/src/sadar_research/trajectory_anomaly/releases/phase6_training_artifacts.lock.json \
            --destination /tmp/sadar-ci-phase6

      - name: Build and verify the deterministic schema-v4 pre-publication release
        run: |
          rm -rf /tmp/sadar-synthetic-demo /tmp/sadar-ci-approach-release /tmp/sadar-ci-first.tar.gz /tmp/sadar-ci-second.tar.gz
          uv run --project backend sadar-build-synthetic-demo \
            --seed 20260718 \
            --output /tmp/sadar-synthetic-demo
          uv run --project backend sadar-build-release \
            --aggregate-results backend/src/sadar/approach/resources/lemd_public_aggregate_results_v1.json \
            --synthetic-payload-dir /tmp/sadar-synthetic-demo \
            --output /tmp/sadar-ci-approach-release
          uv run --project backend sadar-validate-public-release --release-dir /tmp/sadar-ci-approach-release
          uv run --project backend sadar-validate-public-release --release-dir /tmp/sadar-ci-approach-release
          uv run --project backend python - <<'PY'
          from pathlib import Path
          from sadar.releases.archive import create_deterministic_archive
          source = Path("/tmp/sadar-ci-approach-release")
          first = Path("/tmp/sadar-ci-first.tar.gz")
          second = Path("/tmp/sadar-ci-second.tar.gz")
          assert create_deterministic_archive(source, first) == create_deterministic_archive(source, second)
          assert first.read_bytes() == second.read_bytes()
          PY

      - name: Run the full backend suite against the immutable release
        env:
          SADAR_RELEASE_DIR: /tmp/sadar-ci-demo-release
          SADAR_RESEARCH_BUNDLE_DIR: /tmp/sadar-ci-demo-release
          SADAR_RESEARCH_MODELS_DIR: /tmp/sadar-ci-phase6
          SADAR_APPROACH_RELEASE_DIR: /tmp/sadar-ci-approach-release
        run: uv run --project backend pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend suite
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  image-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: contract-and-tests
    steps:
      - name: Check out tracked inputs only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the lockfile compiler
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.11.13

      - name: Build the deterministic schema-v4 local-reviewed context
        run: |
          rm -rf /tmp/sadar-synthetic-demo /tmp/sadar-ci-approach-release
          uv run --project backend sadar-build-synthetic-demo \
            --seed 20260718 \
            --output /tmp/sadar-synthetic-demo
          uv run --project backend sadar-build-release \
            --aggregate-results backend/src/sadar/approach/resources/lemd_public_aggregate_results_v1.json \
            --synthetic-payload-dir /tmp/sadar-synthetic-demo \
            --output /tmp/sadar-ci-approach-release
          uv run --project backend sadar-validate-public-release --release-dir /tmp/sadar-ci-approach-release

      - name: Build the digest-pinned frontend stage
        run: docker build --platform linux/amd64 --target frontend-build --tag sadar-frontend:${{ github.sha }} .

      - name: Build the hashed Python dependency stage
        run: docker build --platform linux/amd64 --target python-deps --tag sadar-python:${{ github.sha }} .

      - name: Build the final linux/amd64 image
        run: >-
          docker build --platform linux/amd64 --target runtime
          --build-context approach-release-context=/tmp/sadar-ci-approach-release
          --build-arg SADAR_RELEASE_SOURCE=local-reviewed
          --build-arg SOURCE_COMMIT=${{ github.sha }}
          --tag sadar:${{ github.sha }} .

      - name: Smoke the distributed image
        env:
          SADAR_SMOKE_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/container-smoke.sh sadar:${{ github.sha }}
