name: Clean checkout delivery

on:
  pull_request:
  push:
    branches: [main, develop, task-sadar-merge-c]

permissions:
  contents: read

concurrency:
  group: clean-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out tracked inputs only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the lockfile compiler
        run: python3 -m pip install --disable-pip-version-check uv==0.11.13

      - name: Validate delivery contracts
        run: scripts/check-delivery-contract.py

      - name: Prove the Linux serving lock regenerates without drift
        run: |
          cp backend/serve/requirements-linux-x86_64.lock /tmp/requirements-linux-x86_64.lock
          scripts/compile-serving-lock.sh
          cmp /tmp/requirements-linux-x86_64.lock backend/serve/requirements-linux-x86_64.lock

      - name: Detect the external T5 publication input
        id: release
        run: |
          if test -f backend/serve/demo_bundle.lock.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'T5 external publication is pending; app-import integration tests require the real locked release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch the immutable release for backend integration tests
        if: steps.release.outputs.ready == 'true'
        run: >-
          python3 -m backend.scripts.fetch_demo_bundle
          --lock backend/serve/demo_bundle.lock.json
          --destination /tmp/sadar-ci-release

      - name: Run the full backend suite against the immutable release
        if: steps.release.outputs.ready == 'true'
        env:
          SADAR_RELEASE_DIR: /tmp/sadar-ci-release
        run: uv run --project backend pytest

      - name: Run the pre-publication backend subset
        if: steps.release.outputs.ready != 'true'
        run: >-
          uv run --project backend pytest
          --ignore backend/tests/test_serve_simulation.py
          --ignore backend/tests/test_evaluation_api.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend suite
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  image-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: contract-and-tests
    steps:
      - name: Check out tracked inputs only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enforce the external T5 publication gate
        run: |
          if ! test -f backend/serve/demo_bundle.lock.json; then
            echo '::error::T5 is blocked: publish and redownload-verify the real immutable release, then commit backend/serve/demo_bundle.lock.json.'
            echo 'Final image build and smoke were not claimed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build the digest-pinned frontend stage
        run: docker build --platform linux/amd64 --target frontend-build --tag sadar-frontend:${{ github.sha }} .

      - name: Build the hashed Python dependency stage
        run: docker build --platform linux/amd64 --target python-deps --tag sadar-python:${{ github.sha }} .

      - name: Build the final linux/amd64 image
        run: >-
          docker build --platform linux/amd64 --target runtime
          --build-arg SOURCE_COMMIT=${{ github.sha }}
          --tag sadar:${{ github.sha }} .

      - name: Smoke the distributed image
        run: scripts/container-smoke.sh sadar:${{ github.sha }}
