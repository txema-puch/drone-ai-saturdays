app = "sadar-analyst-console"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  SADAR_ENABLE_EVALUATION = "true"
  SADAR_EVALUATION_TIMEOUT_S = "60"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
